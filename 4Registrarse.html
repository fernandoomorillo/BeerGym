<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Gym - Registrarse</title>
    <link rel="stylesheet" href="beergym.css">
</head>

<body class="body-Registrarse">

    <header class="top-bar">
        <a href="1Beergym.html" aria-label="Ir a inicio">
            <img src="Logo.png" class="logo-top" alt="Beer Gym">
        </a>
    </header>

    <div class="overlay_menu"></div>

    <main class="caja_login">
        <img src="Logo.png" alt="Beer Gym" class="logo-beergym">

        <form action="#" method="post" class="form-registro">
            <label for="usuario" class="sr-only">Nombre de Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Nombre de Usuario" class="input-login" required>

            <label for="email" class="sr-only">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Correo electrónico" class="input-login" required>

            <label for="password" class="sr-only">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" class="input-login" required>

            <button type="submit" class="boton">REGISTRARSE</button>
        </form>

        <a href="5IniciarSesion.html" class="boton boton-secundario">YA TENGO CUENTA</a>
    </main>

</body>
</html>
