<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Gym - Iniciar Sesión</title>
    <link rel="stylesheet" href="Beergym.css">
</head>

<body class="body-IniciarSesion">

    <header class="top-bar">
        <a href="1Beergym.html" aria-label="Ir a inicio">
            <img src="resources/BeerGymNegro.png" class="logo-top" alt="Beer Gym">
        </a>
    </header>

    <div class="overlay_menu"></div>

    <main class="caja_login">
        <img src="resources/BeerGymNegro.png" alt="Beer Gym" class="logo-beergym">

        <form action="#" method="post" class="form-registro">
            <label for="email" class="sr-only">Correo electrónico o usuario</label>
            <input type="text" id="email" name="email" placeholder="Correo electrónico o usuario" class="input-login" required>

            <label for="password" class="sr-only">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" class="input-login" required>

            <button type="submit" class="boton">INICIAR SESIÓN</button>
        </form>

        <a href="4Registrarse.html" class="boton boton-secundario">CREAR CUENTA</a>

        <a href="#" class="link-olvide">¿Olvidaste tu contraseña?</a>
    </main>

</body>
</html>
